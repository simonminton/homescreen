<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Homescreen</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,300;9..144,400;9..144,500&family=IBM+Plex+Mono:wght@300;400;500&display=swap"
    rel="stylesheet"
  />
  <meta name="theme-color" content="#0a0e27" />
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><circle cx='50' cy='50' r='34' fill='%23ffd98a'/></svg>" />
  <!-- Bump ?v= on style.css and app.js together when deploying changes -->
  <link rel="stylesheet" href="style.css?v=6" />
</head>
<body>
  <!-- Atmospheric layers -->
  <div class="sky" id="sky"></div>
  <div class="orb" id="orb">
    <div class="orb-glow"></div>
    <div class="sun-layer" id="sunLayer">
      <div class="sun-rays"></div>
      <div class="sun-core"></div>
    </div>
    <div class="moon-layer" id="moonLayer"></div>
  </div>
  <div class="clouds" id="clouds" aria-hidden="true">
    <div class="cloud c1"></div>
    <div class="cloud c2"></div>
    <div class="cloud c3"></div>
    <div class="cloud c4"></div>
    <div class="cloud c5"></div>
    <div class="cloud c6"></div>
  </div>
  <canvas class="particles" id="particles"></canvas>
  <div class="lightning" id="lightning" aria-hidden="true"></div>
  <div class="condition-veil" id="veil"></div>
  <div class="grain"></div>
  <div class="vignette"></div>

  <main class="screen">
    <!-- Top bar: location + secondary clocks -->
    <header class="topbar">
      <div class="location" id="location">
        <span class="dot" id="locDot"></span>
        <button class="loc-nav" id="locPrev" type="button" aria-label="Previous location" hidden>‹</button>
        <span id="locName">Locating…</span>
        <button class="loc-nav" id="locNext" type="button" aria-label="Next location" hidden>›</button>
        <span class="loc-time" id="locTime" hidden></span>
        <button class="precise-btn" id="preciseBtn" hidden>update location</button>
      </div>
      <div class="topbar-right">
        <div class="world-clocks" id="worldClocks"></div>
        <div class="settings">
          <button class="settings-btn" id="settingsBtn" type="button" aria-label="Settings" aria-expanded="false">⚙</button>
          <div class="settings-panel" id="settingsPanel" hidden>
            <div class="set-row">
              <span class="set-label">Units</span>
              <div class="seg" id="setUnits">
                <button type="button" data-v="c">°C</button><button type="button" data-v="f">°F</button>
              </div>
            </div>
            <div class="set-row">
              <span class="set-label">Clock</span>
              <div class="seg" id="setClock">
                <button type="button" data-v="24">24h</button><button type="button" data-v="12">12h</button>
              </div>
            </div>
          </div>
        </div>
      </div>
    </header>

    <!-- Hero -->
    <section class="hero">
      <h1 class="time" id="time">--:--</h1>
      <p class="date" id="date">&nbsp;</p>
    </section>

    <!-- Weather -->
    <section class="weather" id="weather">
      <div class="weather-main">
        <div class="wx-icon" id="wxIcon" aria-hidden="true"></div>
        <div class="temp-block">
          <div class="temp" id="temp">--</div>
          <div class="temp-alt"><span id="tempC">--°C</span><span class="sep">/</span><span id="tempF">--°F</span></div>
        </div>
        <div class="wx-meta">
          <div class="condition" id="condition">—</div>
          <div class="hilo">
            <span class="hi"><span class="lbl">HIGH</span><span class="caret">▲</span><span id="tempHi">--°</span></span>
            <span class="lo"><span class="lbl">LOW</span><span class="caret">▼</span><span id="tempLo">--°</span></span>
          </div>
        </div>
        <div class="uv" id="uv">
          <div class="uv-label">UV INDEX</div>
          <div class="uv-value"><span id="uvValue">--</span><span class="uv-band" id="uvBand"></span></div>
        </div>
        <div class="uv moon-stat" id="moonStat" hidden>
          <div class="uv-label">MOON</div>
          <div class="moon-stat-value">
            <span class="moon-mini" id="moonIcon"></span>
            <span class="moon-name" id="moonName">—</span>
            <span class="uv-band moon-illum" id="moonIllum"></span>
          </div>
        </div>
        <div class="uv aqi-stat" id="aqiStat" hidden>
          <div class="uv-label">AIR QUALITY</div>
          <div class="uv-value"><span id="aqiValue">--</span><span class="uv-band" id="aqiBandEl"></span></div>
        </div>
        <div class="uv pollen-stat" id="pollenStat" hidden>
          <div class="uv-label">POLLEN</div>
          <div class="uv-value"><span class="uv-band" id="pollenBandEl"></span></div>
        </div>
      </div>

      <div class="wx-nowcast" id="nowcast" hidden></div>
      <div class="wx-details" id="wxDetails" hidden></div>

      <div class="wx-error" id="wxError" hidden></div>
    </section>

    <!-- Sun & day length -->
    <section class="sun-panel" id="sunPanel" hidden>
      <div class="sun-item sun-next">
        <span class="sun-label" id="sunNextLabel">—</span><span class="sun-val" id="sunNextVal">—</span>
      </div>
      <div class="sun-item"><span class="sun-label">SUNRISE</span><span class="sun-val" id="sunriseVal">—</span></div>
      <div class="sun-item"><span class="sun-label">SUNSET</span><span class="sun-val" id="sunsetVal">—</span></div>
      <div class="sun-item">
        <span class="sun-label">DAYLIGHT</span><span class="sun-val" id="dayLenVal">—</span><span class="sun-delta" id="dayDeltaVal"></span>
      </div>
      <div class="sun-item"><span class="sun-label">GOLDEN HOUR</span><span class="sun-val" id="goldenVal">—</span></div>
    </section>

    <!-- 24h timelines: UV (left / top) + rain (right / bottom) -->
    <section class="charts" id="charts">
      <div class="chart uv-chart">
        <div class="chart-head">
          <span class="chart-title">UV INDEX · TODAY</span>
          <span class="chart-legend" id="uvPeak">—</span>
        </div>
        <div class="chart-bars" id="uvBars"></div>
        <div class="chart-axis" id="uvAxis"></div>
      </div>
      <div class="chart rain-chart">
        <div class="chart-head">
          <span class="chart-title">RAIN · TODAY</span>
          <span class="chart-legend" id="rainPeak">—</span>
        </div>
        <div class="chart-bars" id="rainBars"></div>
        <div class="chart-axis" id="rainAxis"></div>
      </div>
    </section>

    <!-- Full-width hourly temperature curve -->
    <section class="temp-chart" id="tempChart" hidden>
      <div class="chart-head">
        <span class="chart-title">TEMPERATURE · TODAY</span>
        <span class="chart-legend" id="tempRange">—</span>
      </div>
      <div class="temp-curve" id="tempCurve">
        <span class="tc-now-line" id="tcNowLine" hidden></span>
        <span class="tc-dot" id="tcDot" hidden></span>
        <span class="tc-label" id="tcLabel" hidden></span>
      </div>
    </section>

    <!-- Scroll affordance -->
    <a class="scroll-hint" id="scrollHint" href="#forecast">7-day forecast<span class="chev">⌄</span></a>
  </main>

  <!-- 7-day forecast (revealed on scroll) -->
  <section class="forecast" id="forecast">
    <h2 class="week-title">7-Day Forecast</h2>
    <div class="week-panel" id="weekPanel"></div>
  </section>

  <script type="module" src="app.js?v=9"></script>
</body>
</html>
